    rel="stylesheet" />
  <style>
    :root {
      --brand-primary: #0f4c81;
      --brand-accent: #1a7fc1;
      --brand-gold: #f9b700;
      --sidebar-w: 252px;
      --header-h: 80px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f7fb;
      color: #1e2a3a;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .page-header {
      background: var(--brand-primary);
      height: var(--header-h);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .18);
    }

    .hamburger-btn {
      display: none;
      background: var(--brand-gold);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 8px;
      color: var(--brand-primary);
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      transition: background .15s;
    }

    .hamburger-btn:hover {
      background: rgba(255, 255, 255, .22);
    }

    .header-brand {
      flex: 1;
    }

    .header-brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .header-brand p {
      font-size: .75rem;
      color: rgba(255, 255, 255, .6);
      margin-top: 2px;
      margin-bottom: 0px;
    }

    .header-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 9px;
      padding: .42rem .85rem;
      min-width: 220px;
      flex-shrink: 0;
      transition: all .15s;
      position: relative;
    }

    .header-search:focus-within {
      background: rgba(0, 0, 0, 0.08);
    }

    .header-search i.search-icon {
      color: rgba(0, 0, 0, 0.5);
      font-size: .9rem;
      flex-shrink: 0;
    }

    .header-search input {
      border: none;
      background: transparent;
      outline: none;
      font-size: .87rem;
      font-family: 'DM Sans', sans-serif;
      width: 100%;
      color: #222;
    }

    .header-search input::placeholder {
      color: rgba(0, 0, 0, 0.4);
    }

    .search-clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.6);
      font-size: .9rem;
      flex-shrink: 0;
      padding: 0;
      line-height: 1;
      display: none;
      transition: color .15s;
    }

    .search-clear-btn:hover {
      color: #000;
    }

    .search-clear-btn.visible {
      display: flex;
      align-items: center;
    }

    /* ── Layout ── */
    .lib-body {
      display: flex;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
      position: relative;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 149;
    }

    .sidebar-overlay.visible {
      display: block;
    }

    /* ── Sidebar ── */
    .doc-sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
      z-index: 150;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: .5rem .6rem .9rem;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 3px;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 3px;
    }

    .sidebar-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #94a3b8;
      padding: .6rem .4rem .3rem;
    }

    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--brand-primary);
      margin: .45rem .2rem;
    }

    .sb-all {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 7px;
      padding: .46rem .6rem;
      font-size: .98rem;
      font-weight: 500;
      color: #4a5e74;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 2px;
    }

    .sb-all i {
      font-size: .95rem;
      flex-shrink: 0;
    }

    .sb-all .sb-badge {
      margin-left: auto;
    }

    .sb-all:hover,
    .sb-all.active {
      background: var(--brand-gold);
      color: var(--brand-primary);
    }

    .sb-all.active {
      font-weight: 600;
    }

    .sb-l1-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 7px;
      padding: .46rem .6rem;
      font-size: .98rem;
      font-weight: 500;
      color: #4a5e74;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 2px;
    }

    .sb-l1-hdr .l1-icon {
      font-size: .95rem;
      flex-shrink: 0;
    }

    .sb-l1-hdr .sb-badge {
      margin-left: auto;
    }

    .sb-l1-hdr .chev {
      font-size: 12px;
      color: #fff;
      transition: transform .2s;
      margin-left: 2px;
    }

    .sb-l1-hdr:hover,
    .sb-l1-hdr.active {
      background: var(--brand-gold);
      color: var(--brand-primary);
    }

    .sb-l1-hdr.active {
      font-weight: 600;
    }

    .sb-l1-hdr.open .chev {
      transform: rotate(90deg);
      color: white;
    }

    .sb-l1-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height .28s ease;
      padding-left: .55rem;
    }

    .sb-l1-body.open {
      max-height: 1400px;
    }

    .sb-l2-leaf {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: .35rem .5rem;
      font-size: .9rem;
      font-weight: 400;
      color: #5a6e82;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 1px;
      text-align: left;
    }

    .sb-l2-leaf::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--brand-primary);
      flex-shrink: 0;
    }

    .sb-l2-leaf .sb-badge {
      margin-left: auto;
    }

    .sb-l2-leaf:hover,
    .sb-l2-leaf.active {
      background: var(--brand-primary);
      color: #fff;
    }

    .sb-l2-leaf.active {
      font-weight: 600;
    }

    .sb-l2-leaf.active::before {
      background: #90c8f0;
    }

    .sb-l2-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: .35rem .5rem;
      font-size: .9rem;
      font-weight: 500;
      color: #5a6e82;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 1px;
    }

    .sb-l2-hdr::before {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--brand-primary);
      flex-shrink: 0;
    }

    .sb-l2-hdr .sb-badge {
      margin-left: auto;
    }

    .sb-l2-hdr .chev2 {
      font-size: .65rem;
      color: #b0bec5;
      transition: transform .2s;
      margin-left: 2px;
    }

    .sb-l2-hdr:hover,
    .sb-l2-hdr.active {
      background: var(--brand-primary);
      color: #fff;
    }

    .sb-l2-hdr.active {
      font-weight: 600;
    }

    .sb-l2-hdr.active::before {
      background: #90c8f0;
    }

    .sb-l2-hdr.open .chev2 {
      transform: rotate(90deg);
    }

    .sb-l2-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height .22s ease;
      padding-left: .75rem;
    }

    .sb-l2-body.open {
      max-height: 600px;
    }

    .sb-l3-leaf {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 5px;
      padding: .28rem .45rem;
      font-size: .85rem;
      font-weight: 400;
      color: #6b7e94;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 1px;
    }

    .sb-l3-leaf::before {
      content: '–';
      color: #c5d0dc;
      font-size: .7rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .sb-l3-leaf .sb-badge {
      margin-left: auto;
    }

    .sb-l3-leaf:hover,
    .sb-l3-leaf.active {
      background: var(--brand-accent);
      color: #fff;
    }

    .sb-l3-leaf.active {
      font-weight: 600;
    }

    .sb-badge {
      font-size: .65rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 9px;
      background: #edf2f7;
      color: #64748b;
      white-space: nowrap;
    }

    /* Mobile search */
    .sidebar-mobile-search {
      display: none;
      padding: .65rem .6rem .1rem;
    }

    .mob-search-inner {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: .35rem .6rem;
      transition: border-color .15s;
    }

    .mob-search-inner:focus-within {
      border-color: var(--brand-accent);
      background: #fff;
    }

    .mob-search-inner i.search-icon {
      color: #94a3b8;
      font-size: .9rem;
      flex-shrink: 0;
    }

    .mob-search-inner input {
      border: none;
      background: transparent;
      outline: none;
      font-size: .88rem;
      font-family: 'DM Sans', sans-serif;
      color: #1e2a3a;
      width: 100%;
    }

    .mob-search-inner input::placeholder {
      color: #b0bec5;
    }

    .mob-clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: .85rem;
      flex-shrink: 0;
      padding: 0;
      line-height: 1;
      display: none;
      transition: color .15s;
    }

    .mob-clear-btn:hover {
      color: #475569;
    }

    .mob-clear-btn.visible {
      display: flex;
      align-items: center;
    }

    /* ── Doc panel ── */
    .doc-panel {
      flex: 1;
      padding: 1.1rem 1.5rem;
      overflow-y: auto;
      min-width: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .panel-header h5 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      color: var(--brand-primary);
    }

    .count-badge {
      font-size: .72rem;
      color: #64748b;
      background: #edf2f7;
      padding: 4px 11px;
      border-radius: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── View toggle ── */
    .view-toggle-group {
      display: flex;
      gap: 4px;
      background: #edf2f7;
      padding: 4px;
      border-radius: 8px;
    }

    .view-toggle-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #64748b;
      font-size: 1rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all .15s;
    }

    .view-toggle-btn:hover {
      color: var(--brand-primary);
    }

    .view-toggle-btn.active {
      background: var(--brand-gold);
      color: var(--brand-primary);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .08);
    }

    /* ── Doc grid container with smooth view transitions ── */
    #docGrid {
      transition: opacity .22s ease, transform .22s ease;
    }

    #docGrid.view-transitioning {
      opacity: 0;
      transform: translateY(6px);
    }

    .doc-section {
      margin-bottom: 1.75rem;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: .65rem;
    }

    .section-heading .type-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 4px 12px 4px 9px;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #4a5e74;
      white-space: nowrap;
    }

    .section-heading .type-pill i {
      font-size: .85rem;
    }

    .section-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .group-heading {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--brand-primary);
      padding: 0 2px;
      margin: .9rem 0 .4rem;
    }

    .subcat-heading {
      font-size: .66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #b8c4d0;
      padding: 0 2px 0 12px;
      margin: .5rem 0 .3rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subcat-heading::before {
      content: '';
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #d1dce8;
    }

    /* ══════════════════════════════════════════
       LIST VIEW — horizontal card (default)
    ══════════════════════════════════════════ */
    .doc-list-wrap {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }

    .doc-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      padding: .75rem .95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color .22s ease, box-shadow .22s ease, transform .18s ease;
      position: relative;
    }

    .doc-card:hover {
      border-color: #d0e8f7;
      border-bottom: 3px solid var(--brand-accent);
      box-shadow: 0 4px 16px rgba(15, 76, 129, .1);
      transform: translateY(-2px);
    }

    /* ══════════════════════════════════════════
       GRID VIEW — vertical card (Image-2 style)
    ══════════════════════════════════════════ */
    .doc-card-new-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 8px;
    }

    @media (min-width: 1200px) and (max-width: 1440px) {
      .doc-card-new-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

     @media (min-width: 992px)  and (max-width: 1199px) {
      .doc-card-new-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

     }

     @media (min-width: 768px)  and (max-width: 991px) {
      .doc-card-new-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .panel-header {
        flex-wrap: nowrap;
      }
    }

    @media (min-width: 576px)  and (max-width: 767px) {
      .doc-card-new-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

      @media (min-width: 420px)  and (max-width: 575px) {
      .doc-card-new-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
       .doc-grid-card-title{
        word-break: break-all;
            -webkit-line-clamp: none !important;
      }
      .bi.bi-hdd{
        display:none;
      }
    }
     @media (max-width: 419px) {
      .doc-card-new-grid {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
      .doc-grid-card-title{
        white-space: normal;
      }
    }

    .doc-grid-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .18s, box-shadow .18s, transform .18s;
      position: relative;
    }

    .doc-grid-card:hover {
      border-color: var(--brand-accent);
      box-shadow: 0 6px 22px rgba(15, 76, 129, .13);
      transform: translateY(-3px);
    }

    .doc-grid-card-top {
      display: none;
    }

    .doc-type-icon-lg {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .1);
    }

    .doc-grid-card-body {
      padding: .85rem .9rem .8rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .doc-grid-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-grid-card-header .doc-type-icon-lg {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .doc-grid-card-title {
      font-size: .9rem;
      font-weight: 700;
      color: #1e2a3a;
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .doc-grid-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 1px;
    }

    .doc-grid-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 9px;
      border-top: 1px solid #f1f5f9;
    }

    .doc-grid-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .doc-grid-meta span {
      font-size: .65rem;
      color: #94a3b8;
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .doc-grid-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-dl-grid {
      font-size: .72rem;
      padding: 5px 11px;
      border-radius: 7px;
      border: 1px solid var(--brand-accent);
      color: #fff;
      background: var(--brand-accent);
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-dl-grid:hover {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: #fff;
    }

    .btn-preview-grid {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      flex-shrink: 0;
    }

    .btn-preview-grid:hover {
      border-color: var(--brand-accent);
      color: var(--brand-accent);
      background: #eff7ff;
    }

    /* ── Shared doc type icon ── */
    .doc-type-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 1px 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all .2s ease;

    .video-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 6px;
    }

    .video-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color .18s, box-shadow .18s;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      border-color: var(--brand-accent);
      box-shadow: 0 4px 18px rgba(15, 76, 129, .12);
    }

    .video-thumb-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #0a1828;
      overflow: hidden;
      flex-shrink: 0;
    }

    .video-thumb-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #0d2d4e 0%, #0a1828 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity .2s;
      z-index: 2;
    }

    .video-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(249, 183, 0, .92);
      color: #0f4c81;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
      transition: transform .18s, background .15s;

      background: var(--brand-gold);
    }

      margin-top: 10px;
      font-size: .72rem;
      font-weight: 600;
      color: rgba(255, 255, 255, .7);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

      font-weight: 700;
      color: #1e2a3a;
      line-height: 1.35;
    }

      padding-top: 6px;
      border-top: 1px solid #f1f5f9;

    }

    .video-meta span {
      font-size: .65rem;
      color: #94a3b8;

    }

      padding: 60px 0;
      color: #94a3b8;
    }

    @media (max-width: 900px) {

      }
    }

    @media (max-width: 768px) {
      .hamburger-btn {

      }

      .header-search {

      }

      .doc-sidebar {

        height: calc(100vh - var(--header-h));
        transform: translateX(-100%);
        box-shadow: 4px 0 24px rgba(0, 0, 0, .15);

      .doc-sidebar.open {

      }

      .doc-panel {
        padding: .85rem .9rem;
      }

      .sidebar-mobile-search {
        display: block;
      }

      .doc-name {
        white-space: normal;
      }

      .panel-header {
        flex-wrap: wrap;
        gap: .5rem;
      }

      .view-toggle-group {
        order: 3;
      
        justify-content: flex-end;
      }

    
    }

    @media (max-width: 480px) {
      .page-header {
        padding: 0 1rem;
      }

      .header-brand h1 {
        font-size: 1.05rem;
      }

      .header-brand p {
        display: none;
      }

      .doc-name {
        white-space: normal;
        word-break: break-all;
      }

      .view-toggle-btn {
        width: 32px;
        height: 32px;
        font-size: .85rem;
      }
    }

    @media (min-width: 1200px) and (max-width: 1440px) {
      .doc-list-wrap {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1199px) {
      .doc-list-wrap {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }
      .doc-name {
        white-space: normal;
      }
    }

    @media (max-width: 768px) {
      .doc-list-wrap {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    /* ════════════════════════════════════════════════════════════════════
       APPLICATION LOGIC
    ═════════════════════════════════════════════════════════════════════*/

    const safeId = s => s.replace(/[^a-zA-Z0-9_-]/g, '_');
    const toArr = v => v == null || v === "" ? [] : Array.isArray(v) ? v : [v];
    const allSubs = () => Object.keys(CATS).flatMap(k => CATS[k].subs);
    const subEntry = name => allSubs().find(s => s.name === name);

    function getCatForParent(d, parentKey) {
      if (d.catMap && Object.prototype.hasOwnProperty.call(d.catMap, parentKey)) {
        return toArr(d.catMap[parentKey]);
      }
      return toArr(d.cat);
    }

    /* State */
    let activeParent = null;
    let activeSub = null;
    let activeSubSub = null;
    let activeDocType = null;
    let activeDocCat = null;
    let searchQuery = "";
    let openL1 = {};
    let openL2Sub = {};
    let viewMode = "list"; // DEFAULT: list view

    /* ── Mobile sidebar ── */
    function openSidebar() {
      document.getElementById("docSidebar").classList.add("open");
      document.getElementById("sidebarOverlay").classList.add("visible");
      document.getElementById("hamburgerIcon").className = "bi bi-x";
    }
    function closeSidebar() {
      document.getElementById("docSidebar").classList.remove("open");
      document.getElementById("sidebarOverlay").classList.remove("visible");
      document.getElementById("hamburgerIcon").className = "bi bi-list";
    }
    function closeSidebarOnMobile() { if (window.innerWidth <= 768) closeSidebar(); }
    document.getElementById("hamburgerBtn").addEventListener("click", () =>
      document.getElementById("docSidebar").classList.contains("open") ? closeSidebar() : openSidebar()
    );

    /* ── View mode ── */
    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById("gridViewBtn").classList.toggle("active", mode === "grid");
      document.getElementById("listViewBtn").classList.toggle("active", mode === "list");
      render();
    }

    /* ── Filter ── */
    function getFiltered() {
      const [activeSubParent, activeSubName] = (activeSub || "").split("@@");

      return DOCS.filter(d => {
        const parents = toArr(d.parent).map(p => p.toLowerCase());
        const subcats = toArr(d.subcat).map(s => s.toLowerCase());

        if (activeParent && !parents.includes(activeParent.toLowerCase())) return false;

        if (activeSub) {
          const effectiveCats = getCatForParent(d, activeSubParent).map(c => c.toLowerCase());
          if (!effectiveCats.includes(activeSubName.toLowerCase())) return false;
        }

        if (activeSubSub && !subcats.includes(activeSubSub.toLowerCase())) return false;
        if (activeDocType && d.type !== activeDocType) return false;

        if (activeDocCat) {
          const flatCats = toArr(d.cat).map(c => c.toLowerCase());
          if (!flatCats.includes(activeDocCat.toLowerCase())) return false;
        }

        if (searchQuery) {
          const allCats = Object.keys(CATS).flatMap(pk => getCatForParent(d, pk));
          const haystack = [d.name, ...allCats, ...toArr(d.subcat), d.type]
            .join(" ").toLowerCase();
          if (!haystack.includes(searchQuery)) return false;
        }

        return true;
      });
    }

    /* ── Search ── */
    function handleSearch(v) {
      searchQuery = v.trim().toLowerCase();
      document.getElementById("searchBoxHeader").value = v;
      document.getElementById("searchBoxMobile").value = v;
      const hasVal = v.length > 0;
      document.getElementById("searchClearHeader").classList.toggle("visible", hasVal);
      document.getElementById("searchClearMobile").classList.toggle("visible", hasVal);
      render();
    }
    function clearSearch() { handleSearch(""); }

    /* ── Nav clicks ── */
    function clickAll() {
      activeParent = null; activeSub = null; activeSubSub = null;
      activeDocType = null; activeDocCat = null;
      openL1 = {}; openL2Sub = {};
      render();
    }

    function clickDocType(t) {
      if (activeDocType === t && !activeDocCat) { openL1[t] = !openL1[t]; }
      else {
        activeDocType = t; activeDocCat = null;
        activeParent = null; activeSub = null; activeSubSub = null;
        openL1 = { [t]: true }; openL2Sub = {};
      }
      render();
    }
    function clickDocTypeCat(t, cat) {
      activeDocType = t; activeDocCat = cat;
      activeParent = null; activeSub = null; activeSubSub = null;
      openL1[t] = true;
      render(); closeSidebarOnMobile();
    }

    function clickParent(p) {
      const others = Object.keys(CATS).filter(k => k !== p);
      if (activeParent === p && !activeSub) { openL1[p] = !openL1[p]; }
      else {
        activeParent = p; activeSub = null; activeSubSub = null;
        activeDocType = null; activeDocCat = null;
        openL1 = { [p]: true };
        others.forEach(o => openL1[o] = false);
        openL2Sub = {};
      }
      render();
    }

    function clickSub(parent, sub) {
      activeParent = parent;
      activeDocType = null; activeDocCat = null;
      openL1[parent] = true;
      const subKey = `${parent}@@${sub}`;
      const entry = subEntry(sub);
      if (entry && entry.subcats.length > 0) {
        if (activeSub === subKey && !activeSubSub) { openL2Sub[subKey] = !openL2Sub[subKey]; }
        else { activeSub = subKey; activeSubSub = null; openL2Sub = { [subKey]: true }; }
      } else {
        activeSub = subKey; activeSubSub = null; openL2Sub = {};
        closeSidebarOnMobile();
      }
      render();
    }

    function clickSubSub(parent, sub, subsub) {
      activeParent = parent;
      activeSub = `${parent}@@${sub}`;
      activeSubSub = subsub;
      activeDocType = null; activeDocCat = null;
      openL1[parent] = true;
      openL2Sub[`${parent}@@${sub}`] = true;
      render(); closeSidebarOnMobile();
    }

    /* ── BUILD SIDEBAR ── */
    function buildSidebar() {
      let h = `<div class="sidebar-label">Browse
  <button class="collapse-all-btn" id="collapseAllBtn" onclick="toggleAllSidebar()">
    <i class="bi bi-arrows-collapse" id="collapseAllIcon"></i>
  </button>
</div>
<button class="sb-all active" id="btn-all" onclick="clickAll();closeSidebarOnMobile();">
  <i class="bi bi-grid-2x2 text-secondary"></i>All Resources
  <span class="sb-badge" id="badge-all">0</span>
</button>
<hr class="sidebar-divider"/>`;

      Object.keys(CATS).forEach(pk => {
        const pg = CATS[pk];
        h += `<div>
    <button class="sb-l1-hdr" id="btn-parent-${pk}" onclick="clickParent('${pk}')">
      <i class="bi ${pg.icon} ${pg.iconColor} l1-icon"></i>${pg.label}
      <span class="sb-badge" id="badge-parent-${pk}">0</span>
      <i class="bi bi-chevron-right chev"></i>
    </button>
    <div class="sb-l1-body" id="subs-${pk}">`;

        pg.subs.forEach(sub => {
          const sid = `${pk}_${safeId(sub.name)}`;
          const ne = sub.name.replace(/'/g, "\\'");
          if (sub.subcats.length > 0) {
            h += `<div>
        <button class="sb-l2-hdr" id="btn-sub-${sid}" onclick="clickSub('${pk}','${ne}')">
          ${sub.name}
          <span class="sb-badge" id="badge-sub-${sid}">0</span>
          <i class="bi bi-chevron-right chev2"></i>
        </button>
        <div class="sb-l2-body" id="subsubs-${sid}">`;
            sub.subcats.forEach(sc => {
              const scid = safeId(sc);
              h += `<button class="sb-l3-leaf" id="btn-ss-${sid}-${scid}"
              onclick="clickSubSub('${pk}','${ne}','${sc.replace(/'/g, "\\'")}')">
            ${sc}
            <span class="sb-badge" id="badge-ss-${sid}-${scid}">0</span>
          </button>`;
            });
            h += `</div></div>`;
          } else {
            h += `<button class="sb-l2-leaf" id="btn-sub-${sid}" onclick="clickSub('${pk}','${ne}')">
          ${sub.name}
          <span class="sb-badge" id="badge-sub-${sid}">0</span>
        </button>`;
          }
        });
        h += `</div></div>`;
      });

      h += `<hr class="sidebar-divider"/>`;

      DOC_TYPES.forEach(t => {
        const m = TYPE_META[t]; const tid = safeId(t);
        h += `<div>
    <button class="sb-l1-hdr" id="btn-${tid}" onclick="clickDocType('${t}')">
      <i class="bi ${m.icon} ${m.pill} l1-icon"></i>${t}
      <span class="sb-badge" id="badge-${tid}">0</span>
      <i class="bi bi-chevron-right chev"></i>
    </button>
    <div class="sb-l1-body" id="cats-${tid}">`;
        allSubs().forEach(sub => {
          const sid = safeId(sub.name); const ne = sub.name.replace(/'/g, "\\'");
          h += `<button class="sb-l2-leaf" id="dtcat-${tid}-${sid}"
          onclick="clickDocTypeCat('${t}','${ne}')">
        ${sub.name}
        <span class="sb-badge" id="badge-dtcat-${tid}-${sid}">0</span>
      </button>`;
        });
        h += `</div></div>`;
      });

      document.getElementById("sidebarScroll").innerHTML = h;
    }

    /* ── ACTIVE STATES ── */
    function updateSidebarActive() {
      const allNone = !activeParent && !activeSub && !activeSubSub &&
        !activeDocType && !activeDocCat && !searchQuery;

      const ba = document.getElementById("btn-all");
      if (ba) ba.classList.toggle("active", allNone);

      DOC_TYPES.forEach(t => {
        const tid = safeId(t);
        const hdr = document.getElementById("btn-" + tid);
        const body = document.getElementById("cats-" + tid);
        if (!hdr) return;
        hdr.classList.toggle("active", activeDocType === t && !activeDocCat);
        hdr.classList.toggle("open", !!openL1[t]);
        body.classList.toggle("open", !!openL1[t]);
      });

      Object.keys(CATS).forEach(p => {
        const hdr = document.getElementById("btn-parent-" + p);
        const body = document.getElementById("subs-" + p);
        if (!hdr) return;
        hdr.classList.toggle("active", activeParent === p && !activeSub);
        hdr.classList.toggle("open", !!openL1[p]);
        body.classList.toggle("open", !!openL1[p]);
      });

      Object.keys(CATS).forEach(pk => {
        CATS[pk].subs.forEach(sub => {
          const sid = `${pk}_${safeId(sub.name)}`;
          const subKey = `${pk}@@${sub.name}`;
          const hdr = document.getElementById("btn-sub-" + sid);
          if (!hdr) return;
          if (sub.subcats.length > 0) {
            const body = document.getElementById("subsubs-" + sid);
            hdr.classList.toggle("active", activeSub === subKey && !activeSubSub);
            hdr.classList.toggle("open", !!openL2Sub[subKey]);
            if (body) body.classList.toggle("open", !!openL2Sub[subKey]);
            sub.subcats.forEach(sc => {
              const btn = document.getElementById(`btn-ss-${sid}-${safeId(sc)}`);
              if (btn) btn.classList.toggle("active", activeSub === subKey && activeSubSub === sc);
            });
          } else {
            hdr.classList.toggle("active", activeSub === subKey);
          }
        });
      });

      DOC_TYPES.forEach(t => {
        const tid = safeId(t);
        allSubs().forEach(sub => {
          const btn = document.getElementById(`dtcat-${tid}-${safeId(sub.name)}`);
          if (btn) btn.classList.toggle("active", activeDocType === t && activeDocCat === sub.name);
        });
      });
    }

    /* ── BADGES ── */
   function updateBadges() {
  const qd = DOCS;

  const ba = document.getElementById("badge-all");
  if (ba) ba.textContent = qd.length;

  // ── Doc Types (Brochure, Datasheet, etc.)
  DOC_TYPES.forEach(t => {
    const tid = safeId(t);
    const td = qd.filter(d => d.type === t);
    const hdrBtn = document.getElementById("btn-" + tid);
    const el = document.getElementById("badge-" + tid);
    if (el) el.textContent = td.length;
    if (hdrBtn) hdrBtn.style.display = td.length === 0 ? "none" : "";

    allSubs().forEach(sub => {
      const cel = document.getElementById(`badge-dtcat-${tid}-${safeId(sub.name)}`);
      const leafBtn = document.getElementById(`dtcat-${tid}-${safeId(sub.name)}`);
      const count = td.filter(d =>
        toArr(d.cat).map(c => c.toLowerCase()).includes(sub.name.toLowerCase())
      ).length;
      if (cel) cel.textContent = count;
      if (leafBtn) leafBtn.style.display = count === 0 ? "none" : "";
    });
  });

  // ── Parent categories (Product, Solution, Software)
  Object.keys(CATS).forEach(p => {
    const count = qd.filter(d =>
      toArr(d.parent).map(x => x.toLowerCase()).includes(p.toLowerCase())
    ).length;
    const el = document.getElementById("badge-parent-" + p);
    const hdrBtn = document.getElementById("btn-parent-" + p);
    if (el) el.textContent = count;
    if (hdrBtn) hdrBtn.style.display = count === 0 ? "none" : "";
  });

  // ── Subs (LoRa, Wi-SUN, etc.) and their subcats
  Object.keys(CATS).forEach(pk => {
    CATS[pk].subs.forEach(sub => {
      const sid = `${pk}_${safeId(sub.name)}`;
      const subCount = qd.filter(d =>
        toArr(d.parent).map(p => p.toLowerCase()).includes(pk.toLowerCase()) &&
        getCatForParent(d, pk).map(c => c.toLowerCase()).includes(sub.name.toLowerCase())
      ).length;

      const el = document.getElementById("badge-sub-" + sid);
      const subBtn = document.getElementById("btn-sub-" + sid);
      if (el) el.textContent = subCount;
      if (subBtn) subBtn.style.display = subCount === 0 ? "none" : "";

      // ── Sub-subcategories (Module, Gateway, etc.)
      sub.subcats.forEach(sc => {
        const scCount = qd.filter(d =>
          toArr(d.parent).map(p => p.toLowerCase()).includes(pk.toLowerCase()) &&
          getCatForParent(d, pk).map(c => c.toLowerCase()).includes(sub.name.toLowerCase()) &&
          toArr(d.subcat).map(s => s.toLowerCase()).includes(sc.toLowerCase())
        ).length;

        const sel = document.getElementById(`badge-ss-${sid}-${safeId(sc)}`);
        const scBtn = document.getElementById(`btn-ss-${sid}-${safeId(sc)}`);
        if (sel) sel.textContent = scCount;
        if (scBtn) scBtn.style.display = scCount === 0 ? "none" : "";
      });
    });
  });
}

    /* ── LIST VIEW DOC CARD (existing horizontal card) ── */
    function docCard(d) {
      const ftm = fileTypeIcon(d.fileType);
      const parents = toArr(d.parent);
      const subcats = toArr(d.subcat);
      const allCats = [...new Set(
        Object.keys(CATS).flatMap(pk => getCatForParent(d, pk)).filter(Boolean)
      )];
      const plTags = parents.map(p => `<span class="tag tag-parent">${CATS[p?.toLowerCase()]?.label || p}</span>`).join("");
      const catTags = allCats.map(c => `<span class="tag tag-sub">${c}</span>`).join("");
      const scTags = subcats.map(sc => `<span class="tag tag-subcat">${sc}</span>`).join("");
      return `<div class="doc-card">
    <div class="doc-type-icon ${ftm.cls}"><i class="bi ${ftm.icon}"></i></div>
    <div class="doc-info">
      <div class="doc-name" title="${d.name}">${d.name}</div>
      <div class="doc-tags">${plTags}${catTags}${scTags}<span class="tag tag-type">${d.type}</span></div>
    </div>
    <div class="doc-meta-right">
      <span class="doc-size">${d.size}</span>
      <span class="doc-date">${d.date}</span>
      <a class="btn-dl" href="${d.file}" download><i class="bi bi-download"></i> Download</a>
    </div>
  </div>`;
    }

    /* ── GRID VIEW DOC CARD (new vertical card — Image-2 style) ── */
    function docCardGrid(d) {
      const ftm = fileTypeIcon(d.fileType);
      const parents = toArr(d.parent);
      const subcats = toArr(d.subcat);
      const allCats = [...new Set(
        Object.keys(CATS).flatMap(pk => getCatForParent(d, pk)).filter(Boolean)
      )];
      const plTags = parents.map(p => `<span class="tag tag-parent">${CATS[p?.toLowerCase()]?.label || p}</span>`).join("");
      const catTags = allCats.map(c => `<span class="tag tag-sub">${c}</span>`).join("");
      const scTags = subcats.map(sc => `<span class="tag tag-subcat">${sc}</span>`).join("");
      return `<div class="doc-grid-card">
    <div class="doc-grid-card-body">
      <div class="doc-grid-card-header">
        <div class="doc-type-icon-lg ${ftm.cls}"><i class="bi ${ftm.icon}"></i></div>
        <div class="doc-grid-card-title" title="${d.name}" >${d.name}</div>
      </div>
      <div class="doc-grid-card-tags">${plTags}${catTags}${scTags}<span class="tag tag-type">${d.type}</span></div>
      <div class="doc-grid-card-footer">
        <div class="doc-grid-meta">
          ${d.size ? `<span><i class="bi bi-hdd"></i>${d.size}</span>` : ''}
          ${d.date ? `<span><i class="bi bi-calendar3"></i>${d.date}</span>` : ''}
        </div>
        <div class="doc-grid-actions">
          <a class="btn-preview-grid" href="${d.file}" target="_blank" title="Preview"><i class="bi bi-eye"></i></a>
          <a class="btn-dl-grid" href="${d.file}" download><i class="bi bi-download"></i> Download</a>
        </div>
      </div>
    </div>
  </div>`;
    }

    /* ── VIDEO CARD ── */
    function videoCard(d) {
      const parents = toArr(d.parent);
      const subcats = toArr(d.subcat);
      const allCats = [...new Set(
        Object.keys(CATS).flatMap(pk => getCatForParent(d, pk)).filter(Boolean)
      )];
      const plTags = parents.map(p => `<span class="tag tag-parent">${CATS[p?.toLowerCase()]?.label || p}</span>`).join("");
      const catTags = allCats.map(c => `<span class="tag tag-sub">${c}</span>`).join("");
      const scTags = subcats.map(sc => `<span class="tag tag-subcat">${sc}</span>`).join("");
      const uid = 'vid_' + d.id;
      return `<div class="video-card">
    <div class="video-thumb-wrap">
      <iframe src="${d.videoUrl || ''}" title="${d.name}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen loading="lazy"></iframe>
      <div class="video-overlay" id="ov_${uid}" onclick="this.classList.add('hidden')">
        <div class="play-btn-circle"><i class="bi bi-play-fill"></i></div>
        <span class="overlay-label">Watch Video</span>
      </div>
    </div>
    <div class="video-card-body">
      <div class="video-card-title">${d.name}</div>
      <div class="video-card-tags">${plTags}${catTags}${scTags}<span class="tag tag-type">Video</span></div>
      <div class="video-card-footer">
        <div class="video-meta"><span>${d.size}</span><span>${d.date}</span></div>
        <a class="btn-dl" href="${d.file}" download><i class="bi bi-download"></i> Download</a>
      </div>
    </div>
  </div>`;
    }

    /* ── RENDER DOCS ── */
    function renderDocs() {
      const grid = document.getElementById("docGrid");
      const titleEl = document.getElementById("panelTitle");
      const countEl = document.getElementById("panelCount");
      const docs = getFiltered();
      const [activeSubParent, activeSubName] = (activeSub || "").split("@@");

      if (activeSubSub) titleEl.textContent = `${activeSubName} \u203a ${activeSubSub}`;
      else if (activeSub) titleEl.textContent = activeSubName;
      else if (activeDocCat) titleEl.textContent = `${activeDocType}s \u203a ${activeDocCat}`;
      else if (activeDocType) titleEl.textContent = `All ${activeDocType}s`;
      else if (activeParent) titleEl.textContent = CATS[activeParent]?.label || activeParent;
      else titleEl.textContent = "All Documents";

      countEl.textContent = `${docs.length} document${docs.length !== 1 ? "s" : ""}`;

      if (!docs.length) {
        grid.innerHTML = `<div class="empty-state"><i class="bi bi-folder2-open"></i><p>No documents found.</p></div>`;
        return;
      }

      const showTypeHdr = !activeDocType;
      const isListView = viewMode === "list";
      const groupParent = activeSubParent || activeParent || null;

      try {
        grid.innerHTML = DOC_TYPES.map(t => {
          const td = docs.filter(d => d.type === t);
          if (!td.length) return "";

          const m = TYPE_META[t];
          const isVideo = t === "Video";

          /* Deduplicate */
          const seenIds = new Set();
          const uniqueTd = [];
          td.forEach(d => { if (!seenIds.has(d.id)) { uniqueTd.push(d); seenIds.add(d.id); } });

          /* Group by effective cat for the active parent context */
          const byCat = {};
          uniqueTd.forEach(d => {
            const cats = groupParent ? getCatForParent(d, groupParent) : toArr(d.cat);
            if (cats.length === 0) {
              (byCat["__uncategorized__"] = byCat["__uncategorized__"] || []).push(d);
            } else if (activeSubName) {
              const match = cats.find(c => c.toLowerCase() === activeSubName.toLowerCase());
              if (match) (byCat[match] = byCat[match] || []).push(d);
            } else {
              (byCat[cats[0]] = byCat[cats[0]] || []).push(d);
            }
          });
          const multiCat = Object.keys(byCat).length > 1;

          const inner = Object.entries(byCat).map(([cat, cd]) => {
            const bySc = {};
            cd.forEach(d => {
              const subcats = toArr(d.subcat);
              if (subcats.length === 0) {
                (bySc["__none__"] = bySc["__none__"] || []).push(d);
              } else {
                (bySc[subcats[0]] = bySc[subcats[0]] || []).push(d);
              }
            });
            const hasNamedSc = Object.keys(bySc).some(k => k !== "__none__");

            const scHtml = Object.entries(bySc).map(([sc, sds]) => {
              let items = "";
              if (isVideo) {
                items = `<div class="video-card-grid">${sds.map(d => videoCard(d)).join("")}</div>`;
              } else if (isListView) {
                /* LIST VIEW — horizontal cards stacked */
                items = `<div class="doc-list-wrap">${sds.map(d => docCard(d)).join("")}</div>`;
              } else {
                /* GRID VIEW — new vertical card style */
                items = `<div class="doc-card-new-grid">${sds.map(d => docCardGrid(d)).join("")}</div>`;
              }
              return (hasNamedSc && sc !== "__none__")
                ? `<div class="subcat-heading">${sc}</div>${items}` : items;
            }).join("");

            return (multiCat && cat !== "__uncategorized__"
              ? `<div class="group-heading">${cat}</div>` : "") + scHtml;
          }).join("");

          if (showTypeHdr) {
            return `<div class="doc-section">
          <div class="section-heading">
            <span class="type-pill"><i class="bi ${m.icon} ${m.pill}"></i>${t}</span>
          </div>${inner}</div>`;
          }
          return `<div class="doc-section">${inner}</div>`;
        }).join("");
      } catch (e) {
        console.error("Render error:", e);
        grid.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-circle"></i><p>Error loading documents. Check console.</p></div>`;
      }
    }

    /* ── Collapse / Expand All ── */
    let allExpanded = false;
    function toggleAllSidebar() {
      allExpanded = !allExpanded;
      Object.keys(CATS).forEach(k => openL1[k] = allExpanded);
      Object.keys(CATS).forEach(pk => {
        CATS[pk].subs.forEach(sub => {
          if (sub.subcats.length > 0) openL2Sub[`${pk}@@${sub.name}`] = allExpanded;
        });
      });
      document.getElementById("collapseAllIcon").className = allExpanded
        ? "bi bi-arrows-expand"
        : "bi bi-arrows-collapse";
      render();
    }

    /* ── Master render ── */
    function render() { updateSidebarActive(); updateBadges(); renderDocs(); }

    /* Init */
    buildSidebar();
    render();
  </script>
